name: Review gate

# Posts the `review-gate` commit status:
#   success = code owners approved, OR (Copilot approved AND every changed file is in .github/AGENTOWNERS)
#   pending = otherwise
#
# Security: every trigger here runs the workflow and script from the default branch, never PR code.
# The status is posted by a GitHub App whose key lives in the `review-gate` environment, which only
# the default branch can use. The ruleset pins the check to that app, so no other workflow can fake it.
#
# Runs triggered by Copilot (its review, and anything chained from it) are held for approval by
# GitHub. So the run started by the author's push waits up to 15 min for Copilot's review of that
# commit, but only when Copilot's verdict could still turn the gate green.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  workflow_run:
    # Reviews can't use pull_request_target, so a no-permission workflow relays them.
    workflows: [Review gate trigger]
    types: [completed]
  schedule:
    # Fallback for missed events and for rule changes on the default branch.
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  # One group per PR: a newer push or review cancels a waiting run, and the new run re-evaluates.
  group: review-gate-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.head_sha || 'all' }}
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: review-gate
      deployment: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/review-gate
          persist-credentials: false
      # App permissions: Commit statuses (write), Contents, Pull requests, org Members (read).
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          client-id: ${{ vars.REVIEW_GATE_CLIENT_ID }}
          private-key: ${{ secrets.REVIEW_GATE_PRIVATE_KEY }}
      - uses: actions/github-script@v9
        with:
          github-token: ${{ steps.app.outputs.token }}
          script: |
            await require('./.github/review-gate/gate.js').run({ github, context, core });
