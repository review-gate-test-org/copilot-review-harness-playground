name: Review gate

# Posts the `review-gate` commit status:
#   success = code owners approved, OR (Copilot approved AND every changed file is in .github/AGENTOWNERS)
#   pending = otherwise
#
# Every trigger here runs the workflow and script from the default branch, never PR code.
# The status is posted with GITHUB_TOKEN, so any workflow with `statuses: write` could also post it.
# ponytail: fine for this playground; move to a GitHub App and pin the ruleset to its ID before real use.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  workflow_run:
    # Reviews can't use pull_request_target, so a no-permission workflow relays them.
    workflows: [Review gate trigger]
    types: [completed]
  schedule:
    # Fallback for missed events and for rule changes on the default branch.
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: review-gate-${{ github.event.pull_request.number || github.event.workflow_run.head_sha || 'all' }}
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/review-gate
          persist-credentials: false
      - uses: actions/github-script@v9
        with:
          script: |
            await require('./.github/review-gate/gate.js').run({ github, context, core });
