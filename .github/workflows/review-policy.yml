name: Review policy

# Sets the `review-policy` commit status that the main ruleset requires.
# The status stays pending until every changed path is approved by Copilot
# (allowlisted, not blocklisted paths) or by one of its code owners.
#
# Security: only events that run the default-branch version of this workflow are
# used (pull_request_target, workflow_run, schedule, workflow_dispatch), PR code is
# never checked out or executed, and the policy + CODEOWNERS are read from the PR's
# base commit through the API.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, edited]
  workflow_run:
    # "Review policy trigger" fires on human and Copilot reviews; "Copilot" is the
    # dynamic workflow that runs Copilot code review.
    workflows: [Review policy trigger, Copilot]
    types: [completed]
  schedule:
    # Safety net for missed events (e.g. trigger runs held for approval).
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  statuses: write

# Every run re-evaluates all open PRs from current API state, so runs are serialized in
# one group: a slow run can't overwrite a newer decision, and when GitHub replaces a
# queued run with a newer one, the newer run covers the same work.
concurrency:
  group: review-policy
  cancel-in-progress: false

jobs:
  evaluate:
    if: github.event.action != 'edited' || github.event.changes.base
    runs-on: ubuntu-latest
    # Holds the optional GitHub App credentials; restrict it to the default branch
    # so workflows running PR code cannot read the key.
    environment:
      name: review-policy
      deployment: false
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/review-policy
          persist-credentials: false

      - id: app-token
        if: vars.REVIEW_POLICY_APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.REVIEW_POLICY_APP_ID }}
          private-key: ${{ secrets.REVIEW_POLICY_APP_PRIVATE_KEY }}

      - uses: actions/github-script@v8
        env:
          USING_APP: ${{ steps.app-token.outcome == 'success' }}
          STATUS_CREATOR: ${{ steps.app-token.outputs.app-slug && format('{0}[bot]', steps.app-token.outputs.app-slug) || 'github-actions[bot]' }}
        with:
          github-token: ${{ steps.app-token.outputs.token || github.token }}
          script: |
            if (process.env.USING_APP !== 'true') {
              core.warning('REVIEW_POLICY_APP_ID is not set: posting the status with GITHUB_TOKEN. Any workflow with statuses: write can spoof it; use the GitHub App for real enforcement.');
            }
            const { run } = require(`${process.env.GITHUB_WORKSPACE}/.github/review-policy/run.js`);
            await run({ github, context, core, statusCreator: process.env.STATUS_CREATOR });
