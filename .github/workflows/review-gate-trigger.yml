name: Review gate trigger

# Relay only: a review event starts `Review gate` through workflow_run.
# No checkout, no secrets, no permissions, so it is safe to run PR-controlled code here.
on:
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions: {}

jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Review on ${{ github.event.pull_request.head.sha }}"
